[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "durastep"
version = "0.1.0"
description = "Durable, idempotent steps for LLM agents: retried or resumed runs never repeat side effects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ananda Poudel", email = "email@anandapoudel.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["agents", "llm", "idempotency", "durable-execution", "retries"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/farfieldai/durastep"
Repository = "https://github.com/farfieldai/durastep"
Issues = "https://github.com/farfieldai/durastep/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/durastep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
